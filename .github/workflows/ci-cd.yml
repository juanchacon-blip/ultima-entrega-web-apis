name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # 1) Compilación + pruebas de cada microservicio
  test:
    name: Compilar y probar (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, task-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: mvn verify
        working-directory: ${{ matrix.service }}
        run: mvn -B verify

      - name: Reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports
          if-no-files-found: ignore

  # 2) Construcción de imágenes Docker y publicación en GitHub Container Registry.
  #    En pull requests solo se construye (no se publica).
  build-and-push:
    name: Imagen Docker (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, task-service, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Dueño del registry en minúsculas
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # 3) Despliegue en Kubernetes con un runner Windows propio (self-hosted)
  deploy:
    name: Desplegar en Kubernetes
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4

      - name: Verificar kubectl y el clúster
        shell: powershell
        run: |
          kubectl version --client
          kubectl cluster-info

      - name: Desplegar
        shell: powershell
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          $owner = $env:GITHUB_REPOSITORY_OWNER.ToLower()
          ./scripts/deploy-k8s.ps1 -Registry "ghcr.io/$owner" -Tag $env:GITHUB_SHA `
            -GhcrUser $env:GITHUB_ACTOR -GhcrToken $env:GHCR_PULL_TOKEN
